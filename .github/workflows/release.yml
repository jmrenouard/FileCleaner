name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            zigbuild: true
            archive: tar.gz
            bin: filecleaner
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            zigbuild: true
            archive: tar.gz
            bin: filecleaner
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            zigbuild: true
            archive: tar.gz
            bin: filecleaner
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            zigbuild: true
            archive: tar.gz
            bin: filecleaner
          - target: armv7-unknown-linux-gnueabihf
            os: ubuntu-latest
            zigbuild: true
            archive: tar.gz
            bin: filecleaner
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            zigbuild: false
            archive: zip
            bin: filecleaner.exe
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            zigbuild: false
            archive: zip
            bin: filecleaner.exe
          - target: aarch64-apple-darwin
            os: macos-latest
            zigbuild: false
            archive: tar.gz
            bin: filecleaner
          - target: x86_64-apple-darwin
            os: macos-latest
            zigbuild: false
            archive: tar.gz
            bin: filecleaner
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install stable Rust toolchain for ${{ matrix.target }}
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry and target artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install Zig for cross-compilation
        if: matrix.zigbuild
        uses: mlugg/setup-zig@v2

      - name: Install cargo-zigbuild
        if: matrix.zigbuild
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Build release binary with cargo-zigbuild
        if: matrix.zigbuild
        run: cargo zigbuild --release --target ${{ matrix.target }}

      - name: Build release binary natively
        if: ${{ !matrix.zigbuild }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Unix release archive
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          STAGE="filecleaner-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir -p "dist/${STAGE}"
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "dist/${STAGE}/"
          cp README.md README.fr.md LICENSE "dist/${STAGE}/"
          tar -C dist -czf "dist/${STAGE}.tar.gz" "${STAGE}"
          rm -rf "dist/${STAGE}"

      - name: Package Windows release archive
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $stage = "filecleaner-${{ github.ref_name }}-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path "dist/$stage" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.bin }}" "dist/$stage/"
          Copy-Item "README.md", "README.fr.md", "LICENSE" "dist/$stage/"
          Compress-Archive -Path "dist/$stage" -DestinationPath "dist/$stage.zip" -Force
          Remove-Item -Recurse -Force "dist/$stage"

      - name: Upload target archive artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: dist/filecleaner-${{ github.ref_name }}-${{ matrix.target }}.${{ matrix.archive }}

  publish-release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all built target archives
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA-256 checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Attach release archives and checksums to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
