[package]
name = "filecleaner"
version = "1.0.1"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/jmrenouard/FileCleaner"
description = "Production-grade Rust directory retention engine with backup safety guardrails, multi-probe in-use file detection, lifecycle hooks, transforms, and daemon mode"
keywords = ["cleanup", "retention", "backup", "logrotate", "daemon"]
categories = ["command-line-utilities", "filesystem"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
serde_yaml_ng = "0.10"
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2"
globset = "0.4"
regex = "1"
flate2 = "1"
lz4_flex = "0.11"
brotli = "7"
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
notify = "8"
ctrlc = { version = "3", features = ["termination"] }
thiserror = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"
