# FileCleaner Production Example: DBA PostgreSQL Base Backups & WAL Archive to S3
# Features:
#   - Fail-closed S3 archival sink (`upload_s3`) with mandatory SHA-256 verification before local deletion
#   - PITR protection: `.history`, `.partial`, `.ready`, `.done`, `.tmp`, and `archive_status/**` excluded
#   - Dead-man's-switch staleness freeze on base backups (`require_newer_within = "36h"`)
#   - Pre-delete WAL boundary safety hook (`examples/hooks/verify_pg_wal_safe.sh`, exit 42 veto)
#   - Zero plaintext secrets: credentials read strictly from AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY

dry_run = false
global_trash_dir = "/var/tmp/filecleaner-trash"

[daemon]
mode = "hybrid"
interval = "5m"
watch = true
debounce = "2s"
sweep_on_start = true
pid_file = "/run/filecleaner/pg-wal-s3.pid"
state_file = "/run/filecleaner/pg-wal-s3-state.json"
stop_file = "/run/filecleaner/pg-wal-s3.stop"

[audit]
log_path = "/var/log/filecleaner/pg-wal-s3-audit.jsonl"
jsonl = true

[s3]
bucket = "pg-pitr-archive"
region = "eu-west-3"
endpoint = "https://minio.internal:9000"
force_path_style = true
allow_insecure_http = false
overwrite = false
verify_mode = "checksum_sha256"
access_key_env = "AWS_ACCESS_KEY_ID"
secret_key_env = "AWS_SECRET_ACCESS_KEY"
session_token_env = "AWS_SESSION_TOKEN"
timeout = "60s"
max_retries = 3
multipart_part_size = "16MiB"

[[rules]]
name = "pg-base-backups"
path = "/var/backups/postgres/base"
enabled = true
recursive = true
max_depth = 2
follow_symlinks = false
include_globs = ["*.sql", "*.sql.gz", "*.dump", "*.tar"]
exclude_globs = ["pinned/**", "*.keep"]
min_file_size = "1KiB"
time_basis = "filename_date"
filename_date_regex = 'pg_(\d{8}_\d{6})'
filename_date_format = "%Y%m%d_%H%M%S"
max_files = 14
max_age = "30d"
max_total_size = "200GiB"
combine_mode = "any"
eviction_order = "oldest_first"
actions = ["compress", "upload_s3", "delete"]
compression = "gzip"
compression_level = 6
compress_remove_source = true
compress_overwrite = false

[rules.s3]
bucket = "pg-pitr-archive"
region = "eu-west-3"
endpoint = "https://minio.internal:9000"
prefix = "postgres/base-backups"
key_date_subdir = "%Y/%m"
force_path_style = true
overwrite = false
verify_mode = "checksum_sha256"

[rules.backup_guard]
enabled = true
min_keep_files = 7
min_valid_backup_bytes = "1MiB"
require_newer_within = "36h"
freeze_on_empty_valid = true

[rules.in_use]
enabled = true
check_sidecar_locks = true
sidecar_suffixes = [".lock", ".lck", ".part", ".tmp", ".writing"]
check_os_locks = true
check_proc_fd = true
min_idle_age = "2m"
stability_window = "5s"

[[rules]]
name = "pg-wal-archive"
path = "/var/lib/postgresql/wal_archive"
enabled = true
recursive = false
follow_symlinks = false
include_regex = '^[0-9A-F]{24}$'
exclude_globs = ["*.history", "*.partial", "*.ready", "*.done", "*.tmp", "archive_status/**"]
min_file_size = "16MiB"
time_basis = "modified"
max_files = 64
max_age = "7d"
max_total_size = "100GiB"
combine_mode = "any"
eviction_order = "oldest_first"
actions = ["compress", "upload_s3", "delete"]
compression = "lz4"
compress_remove_source = true
compress_overwrite = false

[rules.s3]
bucket = "pg-pitr-archive"
region = "eu-west-3"
endpoint = "https://minio.internal:9000"
prefix = "postgres/wal"
key_date_subdir = "%Y/%m/%d"
force_path_style = true
overwrite = false
verify_mode = "checksum_sha256"

[rules.backup_guard]
enabled = true
min_keep_files = 16
min_valid_backup_bytes = "16MiB"
freeze_on_empty_valid = true

[rules.in_use]
enabled = true
check_sidecar_locks = true
check_os_locks = true
check_proc_fd = true
min_idle_age = "60s"
stability_window = "3s"

[rules.pre_delete_hook]
command = "examples/hooks/verify_pg_wal_safe.sh"
args = ["--file", "{path}", "--name", "{name}", "--rule", "{rule}"]
timeout = "15s"
on_failure = "abort_file"
skip_exit_code = 42
run_in_dry_run = false

[rules.pre_delete_hook.env]
FILECLEANER_PG_MIN_KEEP_WAL_FILE = "/var/lib/postgresql/wal_archive/.pitr_min_keep_wal"
